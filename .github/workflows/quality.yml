name: Quality & Verification Audit

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    name: TypeCheck, Tests & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Vitest Mathematical Unit Tests
        run: npm run test

      - name: Validate TypeScript & Content Schemas
        run: npx astro check

      - name: Test Production Build & Search Index
        run: npm run build
